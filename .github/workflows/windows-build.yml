name: Windows build

on:
  push:
    branches: [main, "bootstrap/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure (downloads pinned Chromium Embedded Framework)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build KANE and CEF sandbox
        run: cmake --build build --config Release --parallel 2

      - name: Run memory-policy tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package full Windows application
        shell: pwsh
        run: |
          $output = "build/Release"
          $package = "KANE-Windows-x64"
          if (!(Test-Path "$output/kane_browser.exe")) {
            throw "CEF bootstrap executable was not produced."
          }
          if (!(Test-Path "$output/kane_browser.dll")) {
            throw "KANE CEF browser module was not produced."
          }
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "$output/*" $package -Recurse -Force
          Copy-Item "README.md" "$package/README.md"
          $cefLicense = Get-ChildItem "build/third_party/cef/cef_binary_*/LICENSE.txt" | Select-Object -First 1
          if ($cefLicense) { Copy-Item $cefLicense.FullName "$package/LICENSE-CEF.txt" }
          @(
            "KANE Browser - Windows x64"
            ""
            "Run kane_browser.exe. Keep the EXE, DLL, CEF resources, and Locales folder together."
            "The first Chromium integration is active; the browser chrome is a temporary CEF sample UI."
            "Do not delete files from this folder: Chromium requires its runtime resources."
          ) | Set-Content "$package/README-FIRST.txt"
          Compress-Archive -Path "$package/*" -DestinationPath "KANE-Windows-x64.zip" -CompressionLevel Optimal

      - name: Upload downloadable application
        uses: actions/upload-artifact@v4
        with:
          name: KANE-Windows-x64
          path: |
            KANE-Windows-x64.zip
            KANE-Windows-x64/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KANE-Windows-x64.zip
